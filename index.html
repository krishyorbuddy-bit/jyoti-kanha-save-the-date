<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e6dc">
<title>Jyoti & Kanha | Save the Date</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#e9d7cd;display:grid;place-items:center;font-family:Georgia,serif}
.stage{position:relative;width:min(100vw,56.25dvh,520px);aspect-ratio:9/16;background:#f5e8df;overflow:hidden;box-shadow:0 10px 45px #513b3b40}
video{width:100%;height:100%;object-fit:contain;display:block}
.cover{position:absolute;inset:0;background:#f6e7ddeb;display:grid;place-items:center;text-align:center;padding:24px;color:#7b4350}
.cover h1{font-size:36px;font-style:italic;font-weight:normal}
.cover p{line-height:1.6}
.open{border:1px solid #bd9b91;border-radius:50px;background:#fff8ee;color:#754352;padding:17px 24px;font:17px Georgia,serif;cursor:pointer}
.hidden{display:none}
.tap{
position:absolute;
left:7.5%;
top:77%;
width:83%;
height:14.5%;
border:0;
border-radius:100px;
background:transparent;
cursor:pointer;
display:none;
}
.tap.active{display:block}
.tap:focus-visible{outline:3px solid #995d67}
.modal{position:fixed;inset:0;background:#281c229c;display:none;place-items:center;padding:20px;z-index:10}
.modal.active{display:grid}
.panel{width:min(100%,380px);background:#fff8ef;border-radius:24px;padding:28px;text-align:center;color:#7c4b57}
.panel h2{font-style:italic;font-weight:normal}
.panel a{display:block;margin:12px 0;padding:16px;border-radius:30px;background:#885367;color:white;text-decoration:none}
.panel button{background:none;border:0;padding:12px;color:#754352;cursor:pointer}
.panel small{display:block;line-height:1.5}


/* WEDDING_IMMERSIVE_FULLSCREEN_V1 */
#invitationScreen{
  position:fixed;inset:0;width:100%;height:100dvh;
  display:grid;place-items:center;overflow:hidden;
  background:#120e13;z-index:1;
}
#invitationScreen .stage{
  width:min(100vw,56.25dvh,520px);
  max-height:100dvh;
  box-shadow:none;
}
#invitationScreen.playing .stage{width:min(100vw,56.25dvh)}
#invitationScreen:fullscreen,
#invitationScreen:-webkit-full-screen{
  width:100%;height:100%;background:#120e13;
}
#invitationScreen:fullscreen .stage,
#invitationScreen:-webkit-full-screen .stage{
  width:min(100vw,56.25dvh);
  max-height:100dvh;
}
#invitationScreen .modal{z-index:20}
#invitationScreen .panel{max-height:calc(100dvh - 40px);overflow-y:auto}
@supports not (height:100dvh){
  #invitationScreen{height:100vh}
}
</style>
</head>
<body>
<div id="invitationScreen">
<main class="stage">
<video id="movie" src="wedding.mp4" playsinline preload="metadata"></video>
<section id="cover" class="cover">
<div>
<h1>Jyoti & Kanha</h1>
<p>Are here to share something beautiful</p>
<button id="open" class="open">Open ♡</button>
</div>
</section>
<button id="tap" class="tap" aria-label="Save the wedding date"></button>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="panel">
<h2 id="modalTitle">Save Our Special Day ♡</h2>
<p>Jyoti & Kanha<br><strong>31 January 2027</strong></p>
<a target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Jyoti%20%26%20Kanha%27s%20Wedding&amp;dates=20270131%2F20270201&amp;details=Your%20presence%20would%20make%20our%20special%20day%20complete.">Google Calendar</a>
<a href="wedding.ics" download="Jyoti-Kanha-Wedding.ics">Apple Calendar / Outlook / Other</a>
<small>For Google Calendar, please set a two-day reminder when saving. The downloaded calendar event includes a two-day reminder request.</small>
<button id="close">Close</button>
</div>
</div>
</div>
<script>
// WEDDING_13S_GATE_V1
const video = document.getElementById("movie");
const cover = document.getElementById("cover");
const tap = document.getElementById("tap");
const modal = document.getElementById("modal");

const UNLOCK_SECONDS = 13;
let watchedSeconds = 0;
let lastTime = null;
let unlocked = false;

// WEDDING_FULLSCREEN_CONTAINER_V1
const invitationScreen = document.getElementById("invitationScreen");
document.getElementById("open").onclick = () => {
  // Request fullscreen synchronously while the user's tap is active.
  // Some iPhone browsers refuse element fullscreen; viewport-filling
  // layout remains the safe fallback without a native video player.
  try {
    const request = invitationScreen.requestFullscreen ||
                    invitationScreen.webkitRequestFullscreen;
    if (request && !document.fullscreenElement) {
      Promise.resolve(request.call(invitationScreen)).catch(() => {});
    }
  } catch (_) {}
  invitationScreen.classList.add("playing");
  video.muted = false;
  const playing = video.play();
  if (playing && playing.then) {
    playing.then(() => cover.classList.add("hidden"))
      .catch(() => alert("Please tap to start the invitation."));
  } else {
    cover.classList.add("hidden");
  }
};

function unlockButton() {
  if (unlocked) return;
  unlocked = true;
  tap.classList.add("active");
}

video.addEventListener("timeupdate", () => {
  const current = video.currentTime;

  if (lastTime !== null &&
      !video.paused &&
      !video.seeking) {
    const delta = current - lastTime;

    // Count only small, forward playback increments.
    if (delta > 0 && delta < 1.5) {
      watchedSeconds += delta;
    }
  }

  lastTime = current;

  if (watchedSeconds >= UNLOCK_SECONDS) {
    unlockButton();
  }
});

video.addEventListener("seeking", () => {
  lastTime = null;
});

// WEDDING_DEVICE_CALENDAR_V1
function detectCalendarPlatform() {
  const ua = navigator.userAgent || "";

  const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" &&
     navigator.maxTouchPoints > 1);

  if (isIOS) return "ios";
  if (/Android/i.test(ua)) return "android";

  return "other";
}

// Detect the device once when the invitation loads.
const calendarPlatform = detectCalendarPlatform();

// WEDDING_DIRECT_CALENDAR_V1 — no provider selection UI.
tap.onclick = () => {
  if (!unlocked) return;

  const eventUrl = new URL("wedding.ics", document.baseURI);

  if (calendarPlatform === "android") {
    const googleLink = document.querySelector(
      '.panel a[href*="calendar.google.com"]'
    );
    window.location.assign(googleLink ? googleLink.href : eventUrl.href);
    return;
  }

  if (calendarPlatform === "ios") {
    // Hand off the single wedding event as a standard .ics file.
    // Some iOS browsers download it; the guest may need to open it.
    window.location.assign(eventUrl.href);
    return;
  }

  // Desktop or unrecognized device: standard calendar event file.
  window.location.assign(eventUrl.href);
};

document.getElementById("close").onclick = () => {
  modal.classList.remove("active");
};

modal.onclick = e => {
  if (e.target === modal) {
    modal.classList.remove("active");
  }
};
</script>

</body>
</html>

<style>
@media (min-width: 800px) {
  #alignPanel {
    left: auto !important;
    right: 20px !important;
    bottom: 20px !important;
    transform: none !important;
  }
}
</style>
