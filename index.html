<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e6dc">
<title>Jyoti & Kanha | Save the Date</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#e9d7cd;display:grid;place-items:center;font-family:Georgia,serif}
.stage{position:relative;width:min(100vw,56.25dvh,520px);aspect-ratio:9/16;background:#f5e8df;overflow:hidden;box-shadow:0 10px 45px #513b3b40}
video{width:100%;height:100%;object-fit:contain;display:block}
.cover{position:absolute;inset:0;background:#f6e7ddeb;display:grid;place-items:center;text-align:center;padding:24px;color:#7b4350}
.cover h1{font-size:36px;font-style:italic;font-weight:normal}
.cover p{line-height:1.6}
.open{border:1px solid #bd9b91;border-radius:50px;background:#fff8ee;color:#754352;padding:17px 24px;font:17px Georgia,serif;cursor:pointer}
.hidden{display:none}
.tap{
position:absolute;
left:7.5%;
top:77%;
width:83%;
height:14.5%;
border:0;
border-radius:100px;
background:transparent;
cursor:pointer;
display:none;
}
.tap.active{display:block}
.tap:focus-visible{outline:3px solid #995d67}
.modal{position:fixed;inset:0;background:#281c229c;display:none;place-items:center;padding:20px;z-index:10}
.modal.active{display:grid}
.panel{width:min(100%,380px);background:#fff8ef;border-radius:24px;padding:28px;text-align:center;color:#7c4b57}
.panel h2{font-style:italic;font-weight:normal}
.panel a{display:block;margin:12px 0;padding:16px;border-radius:30px;background:#885367;color:white;text-decoration:none}
.panel button{background:none;border:0;padding:12px;color:#754352;cursor:pointer}
.panel small{display:block;line-height:1.5}

/* WEDDING_CINEMATIC_GLASS_V2 — noninteractive overlay; no access to phone wallpaper */
.stage{isolation:isolate}
#cinematicGlass{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 900ms ease;overflow:hidden;contain:paint}
.stage.glass-playing #cinematicGlass{opacity:1}
#cinematicGlass::before{content:"";position:absolute;left:13%;top:-5%;width:74%;height:33%;
  border-radius:45% 45% 41% 41% / 48% 48% 38% 38%;
  background:linear-gradient(122deg,rgba(255,250,232,.10),rgba(255,255,255,.24) 23%,rgba(255,239,197,.05) 47%,rgba(255,248,224,.18) 76%,rgba(255,255,255,.04));
  -webkit-backdrop-filter:blur(3px) saturate(1.13);backdrop-filter:blur(3px) saturate(1.13);
  border:1px solid rgba(255,235,191,.38);box-shadow:inset 0 0 24px rgba(255,248,213,.13),0 0 22px rgba(255,219,140,.08);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 33%,transparent 88%);
  mask-image:linear-gradient(to bottom,#000 0%,#000 33%,transparent 88%)}
#cinematicGlass::after{content:"";position:absolute;top:-12%;left:-70%;width:66%;height:58%;
  transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,246,211,.22),transparent);
  filter:blur(14px);animation:wedding-glass-glint 11s ease-in-out infinite}
@keyframes wedding-glass-glint{0%,18%{transform:translateX(0) rotate(18deg);opacity:0}28%{opacity:.45}64%{opacity:.26}82%,100%{transform:translateX(320%) rotate(18deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#cinematicGlass{transition:none}#cinematicGlass::after{animation:none;opacity:0}}
</style>
</head>
<body>
<main class="stage">
<video id="movie" src="wedding.mp4" playsinline preload="metadata"></video>
<div id="cinematicGlass" aria-hidden="true"></div>
<section id="cover" class="cover">
<div>
<h1>Jyoti & Kanha</h1>
<p>Are here to share something beautiful</p>
<button id="open" class="open">Open ♡</button>
</div>
</section>
<button id="tap" class="tap" aria-label="Save the wedding date"></button>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="panel">
<h2 id="modalTitle">Save Our Special Day ♡</h2>
<p>Jyoti & Kanha<br><strong>31 January 2027</strong></p>
<a target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Jyoti%20%26%20Kanha%27s%20Wedding&amp;dates=20270131%2F20270201&amp;details=Your%20presence%20would%20make%20our%20special%20day%20complete.">Google Calendar</a>
<a href="wedding.ics" download="Jyoti-Kanha-Wedding.ics">Apple Calendar / Outlook / Other</a>
<small>For Google Calendar, please set a two-day reminder when saving. The downloaded calendar event includes a two-day reminder request.</small>
<button id="close">Close</button>
</div>
</div>
<script>
// WEDDING_13S_GATE_V1
const video = document.getElementById("movie");
const cover = document.getElementById("cover");
const tap = document.getElementById("tap");
const modal = document.getElementById("modal");

const UNLOCK_SECONDS = 13;
let watchedSeconds = 0;
let lastTime = null;
let unlocked = false;

document.getElementById("open").onclick = async () => {
  try {
    video.muted = false;
    await video.play();
    cover.classList.add("hidden");
    document.querySelector(".stage").classList.add("glass-playing");
  } catch(e) {
    alert("Please tap to start the invitation.");
  }
};

function unlockButton() {
  if (unlocked) return;
  unlocked = true;
  tap.classList.add("active");
}

video.addEventListener("timeupdate", () => {
  const current = video.currentTime;

  if (lastTime !== null &&
      !video.paused &&
      !video.seeking) {
    const delta = current - lastTime;

    // Count only small, forward playback increments.
    if (delta > 0 && delta < 1.5) {
      watchedSeconds += delta;
    }
  }

  lastTime = current;

  if (watchedSeconds >= UNLOCK_SECONDS) {
    unlockButton();
  }
});

video.addEventListener("seeking", () => {
  lastTime = null;
});

// WEDDING_DEVICE_CALENDAR_V1
function detectCalendarPlatform() {
  const ua = navigator.userAgent || "";

  const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" &&
     navigator.maxTouchPoints > 1);

  if (isIOS) return "ios";
  if (/Android/i.test(ua)) return "android";

  return "other";
}

// Detect the device once when the invitation loads.
const calendarPlatform = detectCalendarPlatform();

tap.onclick = () => {
  // Preserve the existing 13-second playback requirement.
  if (!unlocked) return;

  if (calendarPlatform === "ios") {
    // WEDDING_IOS_CALENDAR_CHOICE_V1
    // Explain the file handling before the guest chooses.
    const panel = modal.querySelector(".panel") || modal;
    let hint = document.getElementById("ios-calendar-help");

    if (!hint) {
      hint = document.createElement("p");
      hint.id = "ios-calendar-help";
      hint.textContent =
        "For Apple Calendar, tap the calendar-file option. " +
        "If it downloads, open this invitation in Safari " +
        "and try again. You can also choose Google Calendar.";
      hint.style.cssText =
        "font-size:13px;line-height:1.55;text-align:center;" +
        "margin:14px 6px 4px;opacity:.85;";
      panel.appendChild(hint);
    }

    modal.classList.add("active");
    return;
  }

  if (calendarPlatform === "android") {
    // Google Calendar may open in the installed app
    // or browser depending on Android link settings.
    const googleLink = document.querySelector(
      '.panel a[href*="calendar.google.com"]'
    );

    if (googleLink) {
      window.location.assign(googleLink.href);
      return;
    }
  }

  // Desktop, unknown platform, or missing Google link.
  modal.classList.add("active");
};

document.getElementById("close").onclick = () => {
  modal.classList.remove("active");
};

modal.onclick = e => {
  if (e.target === modal) {
    modal.classList.remove("active");
  }
};
</script>

</body>
</html>

<style>
@media (min-width: 800px) {
  #alignPanel {
    left: auto !important;
    right: 20px !important;
    bottom: 20px !important;
    transform: none !important;
  }
}
</style>
